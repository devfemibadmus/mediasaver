# @format

name: iOS Build and Deploy to TestFlight

on:
    push:
        branches:
            - main
            - release
    workflow_dispatch:
        inputs:
            deploy_to_testflight:
                description: "Deploy to TestFlight"
                required: true
                default: "true"
                type: boolean

jobs:
    build-and-deploy-ios:
        runs-on: macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.27.0"
                  channel: "stable"
                  cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Install Apple Certificate and Provisioning Profile
              env:
                  BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
                  P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
                  BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
                  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
              run: |
                  # Create variables
                  CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
                  PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
                  KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

                  # Import certificate and provisioning profile from secrets
                  echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
                  echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

                  # Create temporary keychain
                  security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
                  security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

                  # Import certificate to keychain
                  security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
                  security list-keychain -d user -s $KEYCHAIN_PATH
                  security default-keychain -s $KEYCHAIN_PATH
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

                  # Apply provisioning profile
                  mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
                  PP_UUID=$(grep -a -A1 'UUID' $PP_PATH | grep string | sed -e 's/<string>//' -e 's/<\/string>//' | tr -d '\t ')
                  cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

            - name: Build iOS app
              run: |
                  flutter build ipa \
                    --release \
                    --export-options-plist=ios/ExportOptions.plist

            - name: Upload to TestFlight
              if: github.event_name == 'push' || github.event.inputs.deploy_to_testflight == 'true'
              env:
                  APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
              run: |
                  # Save API key
                  API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
                  echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o $API_KEY_PATH

                  # Upload to TestFlight
                  xcrun altool --upload-app \
                    --type ios \
                    --file build/ios/ipa/*.ipa \
                    --apiKey $APP_STORE_CONNECT_API_KEY_ID \
                    --apiIssuer $APP_STORE_CONNECT_ISSUER_ID

            - name: Clean up keychain and provisioning profile
              if: always()
              run: |
                  security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
                  rm -rf ~/Library/MobileDevice/Provisioning\ Profiles || true

            - name: Upload IPA artifact
              uses: actions/upload-artifact@v4
              with:
                  name: mediasaver-ios-${{ github.sha }}
                  path: build/ios/ipa/*.ipa
                  retention-days: 30
