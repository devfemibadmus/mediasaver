# @format

name: iOS Build and Deploy to TestFlight

on:
    push:
        branches:
            - ios
    workflow_dispatch:
        inputs:
            deploy_to_testflight:
                description: "Deploy to TestFlight"
                required: true
                default: "true"
                type: boolean

jobs:
    build-and-deploy-ios:
        runs-on: macos-latest
        defaults:
            run:
                working-directory: mobile

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: List available Xcode versions
              working-directory: .
              run: ls /Applications | grep Xcode

            - name: Select latest Xcode
              working-directory: .
              run: |
                  sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || \
                  sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer || \
                  sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
                  xcodebuild -version
                  xcodebuild -showsdks | grep iOS

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  cache: true

            - name: Clean Flutter build outputs
              run: flutter clean

            - name: Install dependencies
              run: |
                  flutter --version
                  flutter precache --ios
                  flutter pub get
                  cd ios
                  pod repo update
                  rm -rf Pods Podfile.lock
                  pod install

            - name: Verify iOS pod integration
              run: |
                  cd ios
                  echo "Flutter directory:"
                  ls -la Flutter || true
                  echo "Flutter podspec:"
                  ls -la Flutter/Flutter.podspec || true
                  echo "Flutter headers in Pods:"
                  find Pods -path '*Flutter.h' -print || true
                  echo "ShareExtension pod xcconfigs:"
                  find Pods -path '*Pods-ShareExtension*.xcconfig' -print -exec sed -n '1,160p' {} \; || true
                  echo "receive_sharing_intent pod xcconfigs:"
                  find Pods -path '*receive_sharing_intent*.xcconfig' -print -exec sed -n '1,160p' {} \; || true

            - name: Install Apple Certificate and Provisioning Profile
              env:
                  BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
                  P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
                  BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
                  SHARE_EXTENSION_PROVISION_PROFILE_BASE64: ${{ secrets.SHARE_EXTENSION_PROVISION_PROFILE_BASE64 }}
                  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
              run: |
                  if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
                    echo "BUILD_PROVISION_PROFILE_BASE64 is not set" >&2
                    exit 1
                  fi
                  if [ -z "$SHARE_EXTENSION_PROVISION_PROFILE_BASE64" ]; then
                    echo "SHARE_EXTENSION_PROVISION_PROFILE_BASE64 is not set" >&2
                    exit 1
                  fi

                  # Create variables
                  CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
                  PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
                  SHARE_EXTENSION_PP_PATH=$RUNNER_TEMP/share_extension_pp.mobileprovision
                  KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

                  # Import certificate and provisioning profile from secrets
                  echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
                  echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
                  echo -n "$SHARE_EXTENSION_PROVISION_PROFILE_BASE64" | base64 --decode -o $SHARE_EXTENSION_PP_PATH

                  # Create temporary keychain
                  security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
                  security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

                  # Import certificate to keychain
                  security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
                  security list-keychain -d user -s $KEYCHAIN_PATH
                  security default-keychain -s $KEYCHAIN_PATH
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

                  # Apply provisioning profile
                  mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
                  PP_UUID=$(grep -a -A1 'UUID' $PP_PATH | grep string | sed -e 's/<string>//' -e 's/<\/string>//' | tr -d '\t ')
                  if [ -z "$PP_UUID" ]; then
                    echo "Could not read UUID from main app provisioning profile" >&2
                    exit 1
                  fi
                  cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
                  echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV

                  SHARE_EXTENSION_PP_UUID=$(grep -a -A1 'UUID' $SHARE_EXTENSION_PP_PATH | grep string | sed -e 's/<string>//' -e 's/<\/string>//' | tr -d '\t ')
                  if [ -z "$SHARE_EXTENSION_PP_UUID" ]; then
                    echo "Could not read UUID from share extension provisioning profile" >&2
                    exit 1
                  fi
                  cp $SHARE_EXTENSION_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$SHARE_EXTENSION_PP_UUID.mobileprovision
                  echo "SHARE_EXTENSION_PP_UUID=$SHARE_EXTENSION_PP_UUID" >> $GITHUB_ENV

                  # Extract signing identity
                  CERTIFICATE_NAME=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | head -1 | grep '"' | sed -e 's/[^"]*"//' -e 's/".*//') 
                  echo "CERTIFICATE_NAME=$CERTIFICATE_NAME" >> $GITHUB_ENV

            - name: Build iOS app
              run: |
                  flutter pub get

                  # Use Flutter's built-in IPA builder with export options
                  flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

            - name: Upload to TestFlight
              if: github.event_name == 'push' || github.event.inputs.deploy_to_testflight == 'true'
              env:
                  APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
              run: |
                  # Create private_keys directory in expected location
                  mkdir -p ~/.appstoreconnect/private_keys

                  # Save API key with correct filename
                  echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8

                  # Upload to TestFlight
                  xcrun altool --upload-app \
                    --type ios \
                    --file mobile/build/ios/ipa/*.ipa \
                    --apiKey $APP_STORE_CONNECT_API_KEY_ID \
                    --apiIssuer $APP_STORE_CONNECT_ISSUER_ID

            - name: Clean up keychain and provisioning profile
              if: always()
              run: |
                  security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
                  rm -rf ~/Library/MobileDevice/Provisioning\ Profiles || true

            - name: Upload IPA artifact
              uses: actions/upload-artifact@v4
              with:
                  name: mediasaver-ios-${{ github.sha }}
                  path: mobile/build/ios/ipa/*.ipa
                  retention-days: 1
