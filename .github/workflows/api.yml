# @format

name: API Deploy

on:
    push:
        branches: [main]
        paths:
            - "api/**"
            - ".github/workflows/api.yml"
    workflow_dispatch:

jobs:
    deploy-api:
        runs-on: ubuntu-latest
        env:
            VPS_HOST: ${{ secrets.VPS_HOST }}
            VPS_USER: ${{ secrets.VPS_USER }}
            VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
            SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
            APP_NAME: ${{ secrets.APP_NAME }}
            APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
            APP_PORT: ${{ secrets.APP_PORT }}
            APP_HOST: ${{ secrets.APP_HOST }}
            CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
            DEPLOY_APP_ENV: ${{ secrets.DEPLOY_APP_ENV }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: 1. Check secrets
              run: |
                  set -euo pipefail

                  missing=0
                  for secret_name in \
                    VPS_HOST \
                    VPS_USER \
                    SSH_PRIVATE_KEY_B64 \
                    APP_NAME \
                    APP_DOMAIN \
                    APP_PORT \
                    APP_HOST \
                    CERTBOT_EMAIL
                  do
                    if [ -z "${!secret_name:-}" ]; then
                      echo "::error::Missing GitHub secret: ${secret_name}"
                      missing=1
                    fi
                  done

                  if [ "$missing" -ne 0 ]; then
                    exit 1
                  fi

                  if ! [[ "$APP_PORT" =~ ^[0-9]+$ ]] || [ "$APP_PORT" -lt 1 ] || [ "$APP_PORT" -gt 65535 ]; then
                    echo "::error::APP_PORT must be a number between 1 and 65535"
                    exit 1
                  fi

                  mkdir -p deploy
                  printf '%s\n' "$DEPLOY_APP_ENV" > deploy/app.env
                  chmod 600 deploy/app.env

                  echo "Required API deployment secrets are present."

            - name: 2. Test VM
              run: |
                  set -euo pipefail

                  mkdir -p ~/.ssh
                  printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/api_deploy_key
                  chmod 600 ~/.ssh/api_deploy_key

                  VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
                  ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
                  ssh -i ~/.ssh/api_deploy_key -p "$VPS_SSH_PORT" -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" \
                    'echo "Connected to $(hostname)" && uname -a'

            - name: 3. Check server requirements
              run: |
                  set -euo pipefail

                  VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
                  SSH_TARGET="${VPS_USER}@${VPS_HOST}"
                  SSH_OPTS=(-i ~/.ssh/api_deploy_key -p "$VPS_SSH_PORT" -o StrictHostKeyChecking=yes)
                  SCP_OPTS=(-i ~/.ssh/api_deploy_key -P "$VPS_SSH_PORT" -o StrictHostKeyChecking=yes)

                  scp "${SCP_OPTS[@]}" api/api.sh "$SSH_TARGET:/tmp/mediasaver-api-requirements.sh"

                  REMOTE_ENV=$(printf 'DEPLOY_MODE=%q APP_NAME=%q APP_DOMAIN=%q APP_PORT=%q APP_HOST=%q CERTBOT_EMAIL=%q' \
                    "requirements" "$APP_NAME" "$APP_DOMAIN" "$APP_PORT" "$APP_HOST" "$CERTBOT_EMAIL")

                  ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "$REMOTE_ENV bash /tmp/mediasaver-api-requirements.sh"

            - name: 4. Cargo build
              run: |
                  set -euo pipefail

                  rustup default stable
                  cd api
                  cargo build --release
                  cd ..

                  mkdir -p deploy
                  cp api/target/release/mediascraper deploy/mediascraper
                  cp api/api.sh deploy/api.sh

            - name: 5. Deploy API service
              run: |
                  set -euo pipefail

                  VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
                  SSH_TARGET="${VPS_USER}@${VPS_HOST}"
                  SSH_OPTS=(-i ~/.ssh/api_deploy_key -p "$VPS_SSH_PORT" -o StrictHostKeyChecking=yes)
                  SCP_OPTS=(-i ~/.ssh/api_deploy_key -P "$VPS_SSH_PORT" -o StrictHostKeyChecking=yes)

                  ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "rm -rf /tmp/mediasaver-deploy && mkdir -p /tmp/mediasaver-deploy/deploy"
                  scp "${SCP_OPTS[@]}" deploy/mediascraper deploy/api.sh deploy/app.env "$SSH_TARGET:/tmp/mediasaver-deploy/deploy/"

                  REMOTE_ENV=$(printf 'APP_NAME=%q APP_DOMAIN=%q APP_PORT=%q APP_HOST=%q CERTBOT_EMAIL=%q' \
                    "$APP_NAME" "$APP_DOMAIN" "$APP_PORT" "$APP_HOST" "$CERTBOT_EMAIL")

                  ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "$REMOTE_ENV chmod +x /tmp/mediasaver-deploy/deploy/api.sh && $REMOTE_ENV APP_BINARY_PATH=/tmp/mediasaver-deploy/deploy/mediascraper APP_ENV_FILE_PATH=/tmp/mediasaver-deploy/deploy/app.env /tmp/mediasaver-deploy/deploy/api.sh"
